name: Build Application and Make Release

on:
  #push:
  #  tags:
  #    - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release'
        required: true
        type: string
jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    with:
      build_type: Release
      is_qt_cached: false
    secrets:
      SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
      WINDOWS_CODESIGN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      APPLE_CODESIGN_CERT: ${{ secrets.APPLE_CODESIGN_CERT }}
      APPLE_CODESIGN_PASSWORD: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
      APPLE_CODESIGN_ID: ${{ secrets.APPLE_CODESIGN_ID }}
      APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
      APPLE_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
      APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_KEY_ID: ${{ secrets.GPG_PRIVATE_KEY_ID }}

  create_release:
    needs: build_release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          path: "MajnrujLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Grab and store version
        run: |
          tag_name=${{ github.event.inputs.tag }}
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/MajnrujLauncher-source MajnrujLauncher-${{ env.VERSION }}
          mv MajnrujLauncher-Linux-Qt6-Portable*/MajnrujLauncher-portable.tar.gz MajnrujLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv MajnrujLauncher-Linux-Qt5-Portable*/MajnrujLauncher-portable.tar.gz MajnrujLauncher-Linux-Qt5-Portable-${{ env.VERSION }}.tar.gz
          mv MajnrujLauncher-*.AppImage/MajnrujLauncher-*.AppImage MajnrujLauncher-Linux-x86_64.AppImage
          mv MajnrujLauncher-*.AppImage.zsync/MajnrujLauncher-*.AppImage.zsync MajnrujLauncher-Linux-x86_64.AppImage.zsync
          mv MajnrujLauncher-macOS-Legacy*/MajnrujLauncher.zip MajnrujLauncher-macOS-Legacy-${{ env.VERSION }}.zip
          mv MajnrujLauncher-macOS*/MajnrujLauncher.zip MajnrujLauncher-macOS-${{ env.VERSION }}.zip

          tar --exclude='.git' -czf MajnrujLauncher-${{ env.VERSION }}.tar.gz MajnrujLauncher-${{ env.VERSION }}

          for d in MajnrujLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="MajnrujLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv MajnrujLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in MajnrujLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="MajnrujLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv MajnrujLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag }}
          name: MAJNRUJ Launcher ${{ env.VERSION }}
          draft: true
          prerelease: false
          files: |
            MajnrujLauncher-Linux-Qt5-Portable-${{ env.VERSION }}.tar.gz
            MajnrujLauncher-Linux-x86_64.AppImage
            MajnrujLauncher-Linux-x86_64.AppImage.zsync
            MajnrujLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            MajnrujLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            MajnrujLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            MajnrujLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            MajnrujLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            MajnrujLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            MajnrujLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            MajnrujLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            MajnrujLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            MajnrujLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            MajnrujLauncher-macOS-${{ env.VERSION }}.zip
            MajnrujLauncher-macOS-Legacy-${{ env.VERSION }}.zip
            MajnrujLauncher-${{ env.VERSION }}.tar.gz
